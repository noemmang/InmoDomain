version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Servicios independientes: un fallo de red en la entrada de MarketData no los bloquea.
  - package-ecosystem: nuget
    directories:
      - /backend/Alerts
      - /backend/Analytics
      - /backend/Gateway
      - /backend/Identity
      - /backend/Notifications
      - /backend/Property
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # MarketData aparte: Microsoft.Extensions.Http.Resilience (ImportJob) arrastra un árbol transitivo grande
  # y sus consultas a nuget.org pueden agotar el tiempo de espera. Api, Data e ImportJob comparten
  # ProjectReference y deben subir juntos para evitar downgrades de NuGet (NU1605).
  - package-ecosystem: nuget
    directories:
      - /backend/MarketData/MarketData.Api
      - /backend/MarketData/MarketData.Data
      - /backend/MarketData/MarketData.ImportJob
    schedule:
      interval: weekly
    groups:
      nuget-marketdata-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend/Alerts
      - /backend/Analytics
      - /backend/Gateway
      - /backend/Identity
      - /backend/MarketData/MarketData.Api
      - /backend/MarketData/MarketData.ImportJob
      - /backend/Notifications
      - /backend/Property
    schedule:
      interval: weekly