location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8080
      transport: auto
      allowInsecure: false
    secrets:
      - name: conn-alerts
        value: ${ALERTS_CONNECTION}
      - name: conn-servicebus
        value: ${SERVICEBUS_APPS_CONNECTION}
      - name: sb-scaler
        value: ${SERVICEBUS_SCALER_CONNECTION}
      - name: jwt-public-key
        value: ${JWT_PUBLIC_KEY}
      - name: analytics-api-key
        value: ${ANALYTICS_API_KEY}
  template:
    containers:
      - name: alerts
        image: ${IMAGE}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: ConnectionStrings__Alerts
            secretRef: conn-alerts
          - name: ConnectionStrings__ServiceBus
            secretRef: conn-servicebus
          - name: Jwt__PublicKey
            secretRef: jwt-public-key
          - name: PropertyApi__BaseUrl
            value: ${URL_PROPERTY}
          - name: AnalyticsApi__BaseUrl
            value: ${URL_ANALYTICS}
          - name: AnalyticsApi__ApiKey
            secretRef: analytics-api-key
        probes:
          - type: Liveness
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 6
    scale:
      minReplicas: 0
      maxReplicas: 1
      rules:
        - name: http
          http:
            metadata:
              concurrentRequests: "20"
        - name: cola-indicesrecalculados
          custom:
            type: azure-servicebus
            metadata:
              queueName: IndicesRecalculados
              messageCount: "1"
            auth:
              - secretRef: sb-scaler
                triggerParameter: connection