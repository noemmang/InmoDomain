location: ${LOCATION}
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: ${ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: false
      targetPort: 8080
      transport: auto
      allowInsecure: false
    secrets:
      - name: conn-property
        value: ${PROPERTY_CONNECTION}
      - name: jwt-public-key
        value: ${JWT_PUBLIC_KEY}
  template:
    containers:
      - name: property
        image: ${IMAGE}
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: ConnectionStrings__Property
            secretRef: conn-property
          - name: Jwt__PublicKey
            secretRef: jwt-public-key
        probes:
          - type: Liveness
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 6
    scale:
      minReplicas: 0
      maxReplicas: 1
      rules:
        - name: http
          http:
            metadata:
              concurrentRequests: "20"